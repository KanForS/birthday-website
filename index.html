<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Happy Birthday Little &#9729;!</title>
    <link rel="stylesheet" href="birthday.css">

    <!-- Preload the cloud/fish images so they start downloading right away,
         instead of only once birthday.js runs and assigns them as src -->
    <link rel="preload" as="image" href="Media/cloud-1.png">
    <link rel="preload" as="image" href="Media/cloud-2.png">
    <link rel="preload" as="image" href="Media/cloud-3.png">
    <link rel="preload" as="image" href="Media/fish-1.png">
    <link rel="preload" as="image" href="Media/fish-2.png">
    <link rel="preload" as="image" href="Media/fish-3.png">
    <link rel="preload" as="image" href="Media/fish-4.png">
  </head>
  <body>

    <div class="birthday-scene">

      <img src="Media/fish-center.png" class="center-fish" id="centerFish" alt="A fish hiding your birthday surprise — click it!">

      <img src="Media/cloud-center.png" class="center-cloud" id="centerCloud" alt="A big fluffy cloud — click it!">

    </div>

    <!-- Kept outside .birthday-scene on purpose: that container is
         transformed for centering, and a transformed ancestor breaks
         position:fixed sizing for anything inside it. Living outside
         lets the video size itself against the real viewport. -->
    <video id="birthdayVideo" class="hidden-video" controls preload="metadata" playsinline>
      <source src="Media/birthday.mp4" type="video/mp4">
    </video>


    <div class="cloud-container"></div>
    <div class="fish-container"></div>


    <script src="birthday.js"></script>
  </body>
</html>
